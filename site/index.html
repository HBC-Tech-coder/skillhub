<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能港 SkillHub — 跨生态 AI 插件与技能聚合</title>
<meta name="description" content="聚合 DSH · WorkBuddy · TRAE · MCP 生态的插件与技能目录：浏览、搜索、一键安装。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head">
    <div class="logo">技</div>
    <div class="brand">技能港 <small>SkillHub</small></div>
    <div class="spacer"></div>
    <input id="hq" placeholder="快速搜索…" aria-label="快速搜索">
  </div>
</header>

<section class="hero">
  <h1>一个地方，装齐所有 AI 的<b>插件与技能</b></h1>
  <p>聚合 DSH · WorkBuddy · TRAE · MCP 生态 — 浏览、评估、一键安装</p>
  <div class="search"><input id="q" placeholder="搜索名称 / 描述 / 作者，例如：dsh、视觉、workbuddy…" aria-label="搜索"></div>
  <div class="stats">
    <div><b id="stCount">—</b>收录条目</div>
    <div><b id="stEco">—</b>生态</div>
    <div><b id="stCat">—</b>分类</div>
    <div><b id="stUpdate">—</b>最近更新</div>
  </div>
</section>

<main>
  <div class="filters" id="ecoFilters" title="生态筛选"></div>
  <div class="filters" id="catFilters" title="分类筛选"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的条目，换个关键词试试</div>
</main>

<div class="modal-bg" id="mbg"><div class="modal" id="modal" role="dialog"></div></div>

<footer>
  技能港 SkillHub · 数据来自开源仓库 <a id="srcLink" target="_blank" rel="noopener">GitHub</a> ·
  本页同时部署于自有服务器与 GitHub Pages 镜像 ·
  <span id="footVer"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
