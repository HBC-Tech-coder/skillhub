name: publish-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build plugins.json
        run: node scripts/build-plugins.js
      - name: Export CSV
        run: node scripts/export-csv.js
      - name: Build item pages + sitemap
        run: node scripts/build-site.js
      - name: Assemble dist (site + data)
        run: |
          mkdir -p dist
          cp -r site/. dist/
          cp data/plugins.json dist/
          cp data/feed.xml dist/
          cp data/skillhub.csv dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
