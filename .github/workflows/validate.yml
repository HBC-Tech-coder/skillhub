name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate entries
        run: node scripts/validate-all.js
      - name: Build plugins.json
        run: node scripts/build-plugins.js
      - name: Validate built output
        run: node scripts/validate-all.js
