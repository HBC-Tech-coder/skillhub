<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能港 SkillHub — 风格 A：亮色极简</title>
<style>
  :root{--bg:#f7f8fa;--card:#ffffff;--line:#e5e7eb;--text:#111827;--sub:#6b7280;--accent:#5b5bd6;--accent-soft:#eef0fe;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  header{background:rgba(247,248,250,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .head{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b5bd6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
  .brand{font-weight:700;font-size:16px;} .brand small{color:var(--sub);font-weight:400;margin-left:6px;}
  .head .spacer{flex:1;}
  .head input{width:min(340px,40vw);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;}
  .hero{max-width:1080px;margin:0 auto;padding:44px 20px 20px;text-align:center;}
  .hero h1{font-size:34px;letter-spacing:-.5px;} .hero h1 b{color:var(--accent);}
  .hero p{color:var(--sub);margin-top:8px;font-size:16px;}
  .hero .search{max-width:560px;margin:22px auto 0;display:flex;gap:8px;}
  .hero .search input{flex:1;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.04);outline:none;}
  .hero .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .stats{display:flex;gap:28px;justify-content:center;margin-top:18px;color:var(--sub);font-size:13px;}
  .stats b{color:var(--text);font-size:16px;display:block;}
  main{max-width:1080px;margin:0 auto;padding:8px 20px 60px;}
  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:13px;color:var(--sub);user-select:none;}
  .chip.on{background:var(--text);color:#fff;border-color:var(--text);}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:10px;}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.07);}
  .card .top{display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;}
  .card .name{font-weight:600;font-size:15px;line-height:1.3;} .card .author{color:var(--sub);font-size:12px;}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;margin-left:auto;flex:none;}
  .card .desc{color:var(--sub);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;}
  .install{display:flex;align-items:center;gap:8px;background:#f3f4f6;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12px;margin-top:auto;}
  .install code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151;}
  .copy{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;flex:none;}
  .card .foot{display:flex;gap:14px;color:var(--sub);font-size:12px;}
  .modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:24px;max-height:86vh;overflow:auto;}
  .modal h2{margin-bottom:4px;} .modal .en{color:var(--sub);margin-bottom:14px;}
  .modal .row{margin:10px 0;font-size:14px;} .modal .row b{display:inline-block;width:64px;color:var(--sub);font-weight:500;}
  .modal .install{background:#f3f4f6;margin-top:14px;}
  .close{margin-top:16px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;}
  .empty{text-align:center;color:var(--sub);padding:50px 0;}
  footer{max-width:1080px;margin:0 auto;padding:24px 20px;color:var(--sub);font-size:12px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<header><div class="head">
  <div class="logo">技</div><div class="brand">技能港 <small>SkillHub</small></div>
  <div class="spacer"></div>
  <input id="hq" placeholder="快速搜索插件 / 技能…">
</div></header>

<div class="hero">
  <h1>一个地方，装齐所有 AI 的<b>插件与技能</b></h1>
  <p>聚合 DSH · WorkBuddy · TRAE · MCP 生态，浏览、评估、一键安装</p>
  <div class="search"><input id="q" placeholder="搜索名称、描述或作者，例如 dsh 或 视觉…"></div>
  <div class="stats">
    <div><b id="st1">0</b>收录条目</div><div><b>4</b>生态</div><div><b id="st2">0</b>分类</div><div><b>开源</b>数据透明</div>
  </div>
</div>

<main>
  <div class="filters" id="ecoFilters"></div>
  <div class="filters" id="catFilters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的条目，换个关键词试试</div>
</main>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<footer>技能港 SkillHub · 风格 A（亮色极简） · 本页为 UI 参考示意，全部条目为示例数据</footer>

<script>
const ECOS={dsh:{label:'DSH',color:'#4d7cfe'},workbuddy:{label:'WorkBuddy',color:'#0aa869'},trae:{label:'TRAE',color:'#f0662f'},mcp:{label:'MCP',color:'#8b5cf6'}};
const CATS={market:'市场与管理',ui:'界面增强',dev:'开发与运行时',vision:'视觉',skill:'技能包',tools:'工具与能力',server:'服务端'};
const ITEMS=[
 {id:'dsh-market',name:'dsh-market',ecosystem:'dsh',kind:'plugin',category:'market',author:'dsh-market',stars:null,install:'dsh plugin --profile web add dshmarket',
  zh:'DSH 网页界面内的插件市场：浏览、搜索、一键安装、主题切换、备份与恢复。',en:'Plugin market inside DeepSeek Harness: browse, search, one-click install, themes, backup.'},
 {id:'modlens',name:'modlens',ecosystem:'dsh',kind:'plugin',category:'vision',author:'liustack',stars:null,install:'dsh plugin --profile web add @liustack/modlens',
  zh:'首个视觉插件：给纯文本模型加视觉理解，OCR / 布局 / 语义结构化 JSON。',en:'First vision plugin: visual understanding for text-only models.'},
 {id:'dsh-popout-sidebar',name:'dsh-popout-sidebar',ecosystem:'dsh',kind:'plugin',category:'ui',author:'e2mcc',stars:145,install:'dsh plugin --profile web add dsh-popout-sidebar',
  zh:'可弹出侧边栏：文件树 + 多格式预览，可弹出独立浏览器标签拖到另一块屏幕。',en:'Pop-out sidebar with file tree and multi-format previews.'},
 {id:'dsh-tui-pi',name:'dsh-tui-pi',ecosystem:'dsh',kind:'plugin',category:'dev',author:'fan56',stars:2,install:'dsh plugin --profile web add @aiwayds/dsh-tui-pi',
  zh:'全功能终端界面：流式对话、状态栏、实时思考/工具/待办面板。',en:'Full-featured TUI for DeepSeek Harness.'},
 {id:'workbuddyskills',name:'WorkBuddy Skills Archive',ecosystem:'workbuddy',kind:'skill',category:'skill',author:'infometa',stars:null,install:'git clone https://github.com/infometa/workbuddyskills',
  zh:'WorkBuddy 技能/连接器/专家归档，供离线学习与部署到 ~/.workbuddy。',en:'WorkBuddy skills/connectors/experts archive for offline study.'},
 {id:'find-skills',name:'find-skills',ecosystem:'trae',kind:'skill',category:'skill',author:'community',stars:null,install:'（TRAE 插件面板内安装）',
  zh:'TRAE 的「能力商店」：把 Skills.sh 接进 Trae，搜索并安装社区技能。',en:'Skills.sh "capability store" for Trae.'},
 {id:'github-mcp-server',name:'GitHub MCP Server',ecosystem:'mcp',kind:'server',category:'tools',author:'github',stars:null,install:'npx -y @github/github-mcp-server（或远程端点）',
  zh:'官方 GitHub MCP：让任意 agent 读写仓库 / issue / PR。',en:'Official GitHub MCP server: repos, issues, PRs for any agent.'},
 {id:'dsh-find-plugin',name:'dsh-find-plugin',ecosystem:'dsh',kind:'plugin',category:'market',author:'awesome-dsh-plugin',stars:null,install:'dsh plugin --profile web add dsh-find-plugin',
  zh:'让 agent 帮你找插件：聊天里直接发现、评估、安装社区插件。',en:'Let your agent find plugins for you.'},
];
let state={q:'',eco:'',cat:''};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function filtered(){return ITEMS.filter(i=>(!state.eco||i.ecosystem===state.eco)&&(!state.cat||i.category===state.cat)&&(!state.q||(i.name+i.zh+i.en+i.author).toLowerCase().includes(state.q.toLowerCase())));}
function render(){
  const grid=document.getElementById('grid');const list=filtered();
  document.getElementById('st1').textContent=ITEMS.length;
  document.getElementById('st2').textContent=Object.keys(CATS).length;
  document.getElementById('empty').style.display=list.length?'none':'';
  grid.innerHTML=list.map(i=>`
   <div class="card" onclick="openModal('${i.id}')">
     <div class="top"><div class="avatar">${esc(i.name[0].toUpperCase())}</div>
       <div><div class="name">${esc(i.name)}</div><div class="author">${esc(i.author)}</div></div>
       <span class="badge" style="background:${ECOS[i.ecosystem].color}">${ECOS[i.ecosystem].label}</span></div>
     <div class="desc">${esc(i.zh)}</div>
     <div class="install"><code>${esc(i.install)}</code><button class="copy" onclick="event.stopPropagation();copyCmd('${i.id}',this)">复制</button></div>
     <div class="foot"><span>⭐ ${i.stars??'—'}</span><span>${CATS[i.category]}</span><span>${i.kind}</span></div>
   </div>`).join('');
}
function renderFilters(){
  document.getElementById('ecoFilters').innerHTML='<div class="chip'+(state.eco?'':' on')+'" onclick="setEco(\'\')">全部</div>'
    +Object.entries(ECOS).map(([k,v])=>`<div class="chip${state.eco===k?' on':''}" onclick="setEco('${k}')"><span class="dot" style="background:${v.color}"></span>${v.label}</div>`).join('');
  document.getElementById('catFilters').innerHTML=Object.entries(CATS).map(([k,v])=>`<div class="chip${state.cat===k?' on':''}" onclick="setCat('${k}')">${v}</div>`).join('');
}
function setEco(v){state.eco=v;renderFilters();render();}
function setCat(v){state.cat=v;renderFilters();render();}
function copyCmd(id,btn){
  const i=ITEMS.find(x=>x.id===id);const done=()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1200);};
  if(navigator.clipboard) navigator.clipboard.writeText(i.install).then(done); else done();
}
function openModal(id){
  const i=ITEMS.find(x=>x.id===id);
  document.getElementById('modal').innerHTML=`
   <div class="top" style="display:flex;align-items:center;gap:10px"><div class="avatar">${esc(i.name[0].toUpperCase())}</div>
     <div><h2>${esc(i.name)}</h2><div class="author">${esc(i.author)}</div></div>
     <span class="badge" style="background:${ECOS[i.ecosystem].color}">${ECOS[i.ecosystem].label}</span></div>
   <div class="en">${esc(i.en)}</div>
   <div class="row"><b>分类</b>${CATS[i.category]} · ${i.kind}</div>
   <div class="row"><b>星标</b>⭐ ${i.stars??'暂无数据'}</div>
   <div class="row"><b>安装</b></div>
   <div class="install"><code>${esc(i.install)}</code><button class="copy" onclick="copyCmd('${i.id}',this)">复制</button></div>
   <button class="close" onclick="document.getElementById('mbg').style.display='none'">关闭</button>`;
  document.getElementById('mbg').style.display='flex';
}
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render();});
document.getElementById('hq').addEventListener('input',e=>{state.q=e.target.value;document.getElementById('q').value=e.target.value;render();});
document.getElementById('mbg').addEventListener('click',e=>{if(e.target.id==='mbg')document.getElementById('mbg').style.display='none';});
renderFilters();render();
</script>
</body>
</html>
