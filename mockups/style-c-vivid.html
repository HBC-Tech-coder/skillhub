<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能港 SkillHub — 风格 C：中文门户/应用商店</title>
<style>
  :root{--text:#1f2430;--sub:#6b7280;--line:#e7e9f0;--card:#fff;--bg:#f4f5fb;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font:15px/1.6 "PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;}
  .hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#06b6d4 100%);color:#fff;padding:46px 20px 74px;}
  .hero .in{max-width:1120px;margin:0 auto;}
  .nav{display:flex;align-items:center;gap:10px;margin-bottom:34px;}
  .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}
  .nav .brand{font-weight:800;font-size:19px;} .nav .sub{opacity:.8;font-size:13px;}
  .nav .spacer{flex:1;}
  .nav a{color:#fff;font-size:13.5px;text-decoration:none;opacity:.9;margin-left:16px;}
  .hero h1{font-size:34px;letter-spacing:1px;} .hero h1 em{font-style:normal;background:rgba(255,255,255,.18);padding:2px 12px;border-radius:10px;}
  .hero p{margin-top:10px;opacity:.92;font-size:16px;}
  .search{max-width:620px;margin:24px auto 0;display:flex;background:#fff;border-radius:14px;padding:6px 6px 6px 18px;box-shadow:0 14px 40px rgba(30,27,75,.35);}
  .search input{flex:1;border:none;outline:none;font-size:15px;color:var(--text);}
  .search button{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;padding:11px 26px;font-size:15px;cursor:pointer;}
  .stats{display:flex;gap:34px;justify-content:center;margin-top:24px;font-size:14px;opacity:.95;}
  .stats b{font-size:20px;display:block;}
  main{max-width:1120px;margin:0 auto;padding:0 20px 50px;margin-top:-44px;}
  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:18px;}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font-size:13px;color:var(--sub);}
  .cat .ico{font-size:24px;display:block;margin-bottom:4px;}
  .cat.on{border-color:#4f46e5;color:#4f46e5;box-shadow:0 4px 14px rgba(79,70,229,.14);}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
  @media(max-width:880px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .panel h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .ecos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .eco{padding:5px 12px;border-radius:999px;color:#fff;font-size:12.5px;cursor:pointer;opacity:.55;}
  .eco.on{opacity:1;box-shadow:0 3px 10px rgba(0,0,0,.18);}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;}
  .card:hover{border-color:#c7cbf5;box-shadow:0 8px 22px rgba(79,70,229,.10);}
  .card .eco{opacity:1;position:absolute;top:12px;right:12px;margin:0;}
  .card .tt{font-weight:700;font-size:15px;padding-right:86px;}
  .card .au{color:var(--sub);font-size:12px;}
  .card .desc{color:var(--sub);font-size:13px;min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .install{display:flex;gap:8px;align-items:center;background:#f6f7fc;border:1px dashed #d5d9f0;border-radius:9px;padding:6px 10px;margin-top:auto;}
  .install code{flex:1;font-size:11.5px;font-family:Consolas,monospace;color:#5b6472;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .copy{background:#4f46e5;color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;flex:none;}
  .card .foot{display:flex;gap:12px;font-size:12px;color:var(--sub);}
  .rank .item{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line);cursor:pointer;}
  .rank .item:last-child{border:none;}
  .rank .num{font-weight:800;color:#c3c8e0;font-size:15px;width:20px;}
  .rank .nm{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank .st{color:#f59e0b;font-size:12px;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:18px;max-width:580px;width:100%;padding:26px;max-height:86vh;overflow:auto;}
  .modal h2{margin-bottom:2px;} .modal .en{color:var(--sub);font-size:13px;margin-bottom:12px;}
  .modal .row{margin:8px 0;font-size:14px;} .modal .row b{color:var(--sub);font-weight:500;display:inline-block;width:70px;}
  .install{background:#f6f7fc;border:1px dashed #d5d9f0;margin-top:12px;}
  .close{margin-top:14px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;}
  .empty{text-align:center;color:var(--sub);padding:46px 0;}
  footer{max-width:1120px;margin:0 auto;padding:20px;color:var(--sub);font-size:12.5px;text-align:center;}
</style>
</head>
<body>
<div class="hero"><div class="in">
  <div class="nav">
    <div class="logo">技</div><div class="brand">技能港<span class="sub"> SkillHub</span></div>
    <div class="spacer"></div>
    <a>插件</a><a>技能</a><a>MCP</a><a>投稿</a>
  </div>
  <div style="text-align:center">
    <h1>一个地方，装齐所有 AI 的<em>插件与技能</em></h1>
    <p>聚合 DSH · WorkBuddy · TRAE · MCP 生态 — 浏览、评估、一键安装</p>
    <div class="search"><input id="q" placeholder="搜索插件 / 技能，例如：视觉、看板、工作流…"><button>搜 索</button></div>
    <div class="stats"><div><b id="s1">0</b>收录条目</div><div><b>4</b>大生态</div><div><b>7</b>个分类</div><div><b>开源</b>数据可审计</div></div>
  </div>
</div></div>

<main>
  <div class="cats" id="cats"></div>
  <div class="layout">
    <div>
      <div class="panel">
        <div class="ecos" id="ecos"></div>
        <div class="cards" id="grid"></div>
        <div class="empty" id="empty" style="display:none">没有找到匹配的内容，换个关键词试试～</div>
      </div>
    </div>
    <div class="panel rank">
      <h3>🔥 热门榜</h3>
      <div id="rank"></div>
      <p style="color:var(--sub);font-size:12px;margin-top:8px">按星标排序 · 示例数据</p>
    </div>
  </div>
</main>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<footer>技能港 SkillHub · 风格 C（中文门户/应用商店） · 本页为 UI 参考示意，全部条目为示例数据 · 底部可预留 ICP 备案号</footer>

<script>
const ECOS={dsh:{label:'DSH',color:'#4d7cfe'},workbuddy:{label:'WorkBuddy',color:'#0aa869'},trae:{label:'TRAE',color:'#f0662f'},mcp:{label:'MCP',color:'#8b5cf6'}};
const CATS={market:{n:'市场与管理',i:'🛒'},ui:{n:'界面增强',i:'🎨'},dev:{n:'开发工具',i:'🛠️'},vision:{n:'视觉',i:'👁️'},skill:{n:'技能包',i:'🧩'},tools:{n:'工具能力',i:'🔧'},server:{n:'服务端',i:'🖥️'}};
const ITEMS=[
 {id:'dsh-market',name:'dsh-market',ecosystem:'dsh',kind:'plugin',category:'market',author:'dsh-market',stars:null,install:'dsh plugin --profile web add dshmarket',
  zh:'DSH 网页界面内的插件市场：浏览、搜索、一键安装、主题切换、备份与恢复。',en:'Plugin market inside DeepSeek Harness: browse, search, one-click install, themes, backup.'},
 {id:'modlens',name:'modlens',ecosystem:'dsh',kind:'plugin',category:'vision',author:'liustack',stars:null,install:'dsh plugin --profile web add @liustack/modlens',
  zh:'首个视觉插件：给纯文本模型加视觉理解，OCR / 布局 / 语义结构化 JSON。',en:'First vision plugin: visual understanding for text-only models.'},
 {id:'dsh-popout-sidebar',name:'dsh-popout-sidebar',ecosystem:'dsh',kind:'plugin',category:'ui',author:'e2mcc',stars:145,install:'dsh plugin --profile web add dsh-popout-sidebar',
  zh:'可弹出侧边栏：文件树 + 多格式预览，可弹出独立浏览器标签拖到另一块屏幕。',en:'Pop-out sidebar with file tree and multi-format previews.'},
 {id:'dsh-tui-pi',name:'dsh-tui-pi',ecosystem:'dsh',kind:'plugin',category:'dev',author:'fan56',stars:2,install:'dsh plugin --profile web add @aiwayds/dsh-tui-pi',
  zh:'全功能终端界面：流式对话、状态栏、实时思考/工具/待办面板。',en:'Full-featured TUI for DeepSeek Harness.'},
 {id:'workbuddyskills',name:'WorkBuddy Skills Archive',ecosystem:'workbuddy',kind:'skill',category:'skill',author:'infometa',stars:null,install:'git clone https://github.com/infometa/workbuddyskills',
  zh:'WorkBuddy 技能/连接器/专家归档，供离线学习与部署到 ~/.workbuddy。',en:'WorkBuddy skills/connectors/experts archive for offline study.'},
 {id:'find-skills',name:'find-skills',ecosystem:'trae',kind:'skill',category:'skill',author:'community',stars:null,install:'（TRAE 插件面板内安装）',
  zh:'TRAE 的「能力商店」：把 Skills.sh 接进 Trae，搜索并安装社区技能。',en:'Skills.sh "capability store" for Trae.'},
 {id:'github-mcp-server',name:'GitHub MCP Server',ecosystem:'mcp',kind:'server',category:'tools',author:'github',stars:null,install:'npx -y @github/github-mcp-server（或远程端点）',
  zh:'官方 GitHub MCP：让任意 agent 读写仓库 / issue / PR。',en:'Official GitHub MCP server: repos, issues, PRs for any agent.'},
 {id:'dsh-find-plugin',name:'dsh-find-plugin',ecosystem:'dsh',kind:'plugin',category:'market',author:'awesome-dsh-plugin',stars:null,install:'dsh plugin --profile web add dsh-find-plugin',
  zh:'让 agent 帮你找插件：聊天里直接发现、评估、安装社区插件。',en:'Let your agent find plugins for you.'},
];
let state={q:'',eco:'',cat:''};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function filtered(){return ITEMS.filter(i=>(!state.eco||i.ecosystem===state.eco)&&(!state.cat||i.category===state.cat)&&(!state.q||(i.name+i.zh+i.en+i.author).toLowerCase().includes(state.q.toLowerCase())));}
function render(){
  const grid=document.getElementById('grid');const list=filtered();
  document.getElementById('s1').textContent=ITEMS.length;
  document.getElementById('empty').style.display=list.length?'none':'';
  grid.innerHTML=list.map(i=>`
   <div class="card" onclick="openModal('${i.id}')">
     <span class="eco" style="background:${ECOS[i.ecosystem].color}">${ECOS[i.ecosystem].label}</span>
     <div class="tt">${esc(i.name)}</div><div class="au">${esc(i.author)} · ${CATS[i.category].n}</div>
     <div class="desc">${esc(i.zh)}</div>
     <div class="install"><code>${esc(i.install)}</code><button class="copy" onclick="event.stopPropagation();copyCmd('${i.id}',this)">复制</button></div>
     <div class="foot"><span>⭐ ${i.stars??'—'}</span><span>${i.kind}</span><span>示例数据</span></div>
   </div>`).join('');
}
function renderCats(){
  document.getElementById('cats').innerHTML=Object.entries(CATS).map(([k,v])=>`<div class="cat${state.cat===k?' on':''}" onclick="setCat('${k}')"><span class="ico">${v.i}</span>${v.n}</div>`).join('');
  document.getElementById('ecos').innerHTML=Object.entries(ECOS).map(([k,v])=>`<span class="eco${state.eco===k?' on':''}" style="background:${v.color}" onclick="setEco('${k}')">${v.label}</span>`).join('');
}
function renderRank(){
  const ranked=[...ITEMS].filter(i=>i.stars!=null).sort((a,b)=>b.stars-a.stars);
  document.getElementById('rank').innerHTML=ranked.map((i,n)=>`<div class="item" onclick="openModal('${i.id}')"><span class="num">${n+1}</span><span class="nm">${esc(i.name)}</span><span class="st">⭐${i.stars}</span></div>`).join('');
}
function setEco(v){state.eco=v;renderCats();render();}
function setCat(v){state.cat=v;renderCats();render();}
function copyCmd(id,btn){
  const i=ITEMS.find(x=>x.id===id);const done=()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1200);};
  if(navigator.clipboard) navigator.clipboard.writeText(i.install).then(done); else done();
}
function openModal(id){
  const i=ITEMS.find(x=>x.id===id);
  document.getElementById('modal').innerHTML=`
   <h2>${esc(i.name)} <span class="eco" style="background:${ECOS[i.ecosystem].color};opacity:1">${ECOS[i.ecosystem].label}</span></h2>
   <div class="en">${esc(i.author)} · ${CATS[i.category].n} · ${i.kind}</div>
   <p style="font-size:14px;margin:10px 0">${esc(i.zh)}</p><p style="font-size:13px;color:var(--sub);margin-bottom:10px">${esc(i.en)}</p>
   <div class="row"><b>星标</b>⭐ ${i.stars??'暂无数据'}</div>
   <div class="row"><b>安装</b></div>
   <div class="install"><code>${esc(i.install)}</code><button class="copy" onclick="copyCmd('${i.id}',this)">复制</button></div>
   <button class="close" onclick="document.getElementById('mbg').style.display='none'">关 闭</button>`;
  document.getElementById('mbg').style.display='flex';
}
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render();});
document.getElementById('mbg').addEventListener('click',e=>{if(e.target.id==='mbg')document.getElementById('mbg').style.display='none';});
renderCats();render();renderRank();
</script>
</body>
</html>
