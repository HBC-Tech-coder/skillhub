# SkillHub vhost 模板（hub.hibcglobal.com → 127.0.0.1:4290）
# 注意：这是【新增】server 块模板，不动任何既有 vhost/配置。
# TLS 由 certbot 补 https 段；域名解析由阿里云云解析添加 A 记录 → 39.105.17.219。

server {
    listen 80;
    server_name hub.hibcglobal.com;

    # 站点与数据（静态）
    location / {
        proxy_pass http://127.0.0.1:4290;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 检索与管理 API 同源代理（管理端点要求 loopback + token，由应用层强制）
    location /api/ {
        proxy_pass http://127.0.0.1:4290;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
